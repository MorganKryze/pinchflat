name: Docker Release

# A tag is the only thing that publishes a version, and `workflow_dispatch`
# the only thing that publishes `dev`.
#
# Upstream also built on every push to master. On a fork that tracks upstream
# that trigger fires on every rebase, republishing an image nobody asked for
# from a merge nobody reviewed. Dropped on purpose.
#
# `release: published` is gone for a different reason: it made a GitHub
# release object the thing that publishes, so the tag and the image could
# disagree about what a version contains. The tag is the single source of
# truth here, and the guard below makes it agree with mix.exs.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Build platforms'
        required: true
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'

# Least privilege by default; each job asks for what it writes.
permissions:
  contents: read

# One release at a time, and not keyed on the ref: what two runs contend for
# is `stable`, which every release writes and no ref distinguishes. Cancelling
# is wrong here too. A release killed halfway leaves published tags behind
# with nothing verified pointing at them.
concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  # Nothing is published that has not passed the suite on this exact ref.
  # Upstream ran linting and the release side by side, so a tag could ship an
  # image whose tests had never run against it.
  test:
    uses: ./.github/workflows/lint_and_test.yml

  # One runner per architecture, each building its own natively. arm64 used to be
  # cross-built here under QEMU, and that was the entire cost of a release: amd64 alone
  # takes about five and a half minutes, amd64 plus an emulated arm64 ran past twenty.
  # Emulating a compiler is slow in a way no cache fixes, since the work is CPU-bound.
  #
  # GitHub gives public repositories arm64 runners at no charge, so there is nothing to
  # emulate any more and setup-qemu-action is gone with it. The two builds also run at the
  # same time, so a release costs roughly what its slower half costs.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # pushes the per-architecture image by digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: the tag agrees with mix.exs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(grep -m1 'version: "' mix.exs | cut -d '"' -f2)
          [ "v${version}" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version $version"
            exit 1; }

      # ghcr refuses a capital in the owner, and this repository has one. Lowercased once,
      # explicitly, rather than relying on an action to do it where the result is not
      # visible.
      - name: work out the image name
        run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 # buildx-stable-1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tags here. Each architecture is pushed by digest and carries no name of its
      # own; the merge job below is what gives the finished index its tags, so no
      # half-published tag can ever point at a single-architecture image.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture. One shared scope has the two builds evicting each
          # other's layers, which is worse than no cache at all.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: hand the digest to the merge job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # Without the sha256: prefix. upload-artifact rejects a colon in a filename,
          # and the merge job puts the prefix back when it rebuilds the reference.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "SLUG=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # writes the tagged index
      id-token: write # cosign signs keylessly against this workflow identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 # buildx-stable-1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: work out the image name
        run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # Without this the action adds `latest` by itself, which is exactly the tag that
          # must not move before the signature has been verified.
          flavor: latest=false
          # Versions are semver (`v1.4.2`). Patch for a fix, minor for a feature, major
          # for anything that changes how an existing instance behaves without being
          # asked - which on a fork whose whole premise is "defaults match upstream"
          # should be close to never.
          #
          # `{{major}}` is deliberately absent. `stable` and `latest` already mean "the
          # newest one that verified", and a bare `1` floating across every feature
          # release would be a third way of saying nearly the same thing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=

      - name: assemble the index from the per-architecture digests
        id: assemble
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="$IMAGE"

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "${image}@sha256:%s " *)

          digest=$(docker buildx imagetools inspect "${image}:${{ steps.meta.outputs.version }}" --format '{{.Manifest.Digest}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Publish immutable, prove, then promote. `stable` and `latest` are the tags a
      # puller is pointed at, and they are the only ones a failure here could leave
      # pointing at something unverified, so they are not in the list above.
      - name: sign the index and prove the signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          DIGEST: ${{ steps.assemble.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

          # `cosign sign` exiting 0 is not proof that anyone else can verify the result,
          # and nothing below moves a tag on the strength of an exit code alone.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github.com/MorganKryze/pinchflat/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      # Retagging is a registry-side copy of the very index that was verified above, so
      # the digest does not change and `stable` cannot exist unsigned. The equality check
      # is not ceremony: if a future buildx ever rebuilt the index instead of copying it,
      # the tag would point at an unsigned digest, and this is what would catch it.
      - name: move stable and latest onto the verified digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          DIGEST: ${{ steps.assemble.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in stable latest; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
            moved=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${tag}")
            [ "$moved" = "$DIGEST" ] || {
              echo "::error::${tag} points at ${moved}, not the signed ${DIGEST}"
              exit 1
            }
          done
